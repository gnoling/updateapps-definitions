name: Inkscape
description: Professional vector graphics editor (SVG)
category: tools
homepage: https://inkscape.org/
source:
  type: html
  url: https://inkscape.org/release/all/gnulinux/appimage/
  select: 'a[href*=".AppImage"]'
  attr: href
  exclude_regex: '\.sig$'
install:
  type: file
  dest: ${APPIMAGEDIR}/Inkscape.AppImage
