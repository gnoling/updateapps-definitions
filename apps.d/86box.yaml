name: 86Box
description: Emulator of classic IBM PC compatibles and DOS-era hardware
category: tools
notes: |
  Nightly CI build. The artifact is the bare AppImage (uploaded unzipped), named with the
  commit, so it's matched by regex.
source:
  type: github-actions
  repo: 86Box/86Box
  workflow: CMake (Linux)
  branch: master
  artifact_regex: '^86Box-Qt6-Dev-Linux-x86_64-.*\.AppImage$'
install:
  type: file
  dest: ${APPDIR}/86Box/86Box
