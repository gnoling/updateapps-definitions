name: BigPEmu
description: Atari Jaguar and Jaguar CD emulator
category: emulators
homepage: https://www.richwhitehouse.com/jaguar/
desktop:
  icon: bigpemu-icon.png
  generic_name: Atari Jaguar Emulator
  keywords: [bigpemu, atari, jaguar, emulator]
source:
  type: html
  url: https://www.richwhitehouse.com/jaguar/index.php?content=download
  select: 'body > a[href*="Linux64"]'
  attr: href
install:
  type: extract
  dest: ${APPDIR}/bigpemu
  strip: 1
  executables: [bigpemu]
