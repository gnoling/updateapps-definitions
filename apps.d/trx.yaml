category: ports
source:
  type: github-release
  repo: LostArtefacts/TRX
  channel: stable
  version_from: tag
asset: 'TRX-*-Linux.zip'
install:
  type: extract
  dest: ${APPDIR}/trx
  executables: [TRX]
