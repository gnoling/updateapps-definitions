name: Hades
description: Highly accurate Game Boy Advance emulator
category: emulators
notes: |
  The artifact is the bare AppImage (uploaded unzipped), named with the version.
source:
  type: github-actions
  repo: hades-emu/Hades
  workflow: Build
  branch: master
  artifact_regex: '^hades-.*-linux-x64\.appimage$'
install:
  type: file
  dest: ${APPIMAGEDIR}/hades.AppImage
